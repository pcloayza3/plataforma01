name: Plataforma01 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-lint:
    name: Pruebas Automatizadas TDD & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias del Backend
        working-directory: ./backend
        run: npm ci

      - name: Ejecutar Suite de Pruebas (TDD, Seguridad y E2E)
        working-directory: ./backend
        run: npm test

  docker-build-verification:
    name: Verificación y Compilación de Imágenes Docker
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Imagen de Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: plataforma01-backend:ci

      - name: Compilar Imagen de Frontend PWA
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: plataforma01-frontend:ci

      - name: Validar Sintaxis de Docker Compose
        run: docker compose config
