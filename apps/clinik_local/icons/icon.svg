<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- Subtle inner border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Stylized Tooth & Medical Cross Combo -->
  <g transform="translate(256, 256) scale(0.72)">
    <!-- Main Tooth Body -->
    <path d="M -130,-140 C -130,-220 -30,-230 0,-170 C 30,-230 130,-220 130,-140 C 130,-60 140,50 80,180 C 50,240 20,240 0,160 C -20,240 -50,240 -80,180 C -140,50 -130,-60 -130,-140 Z" 
          fill="#ffffff" filter="url(#shadow)"/>

    <!-- Medical Plus Cross Inside Tooth -->
    <g fill="url(#grad2)">
      <rect x="-24" y="-120" width="48" height="110" rx="16"/>
      <rect x="-55" y="-89" width="110" height="48" rx="16"/>
    </g>

    <!-- Stethoscope arc / Local Shield aura -->
    <path d="M -90,70 Q 0,130 90,70" fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Small text / indicator -->
  <circle cx="410" cy="102" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
</svg>
